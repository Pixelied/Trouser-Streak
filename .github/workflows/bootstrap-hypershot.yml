name: Materialize and verify HyperShot source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-hypershot.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: hypershot/production-26.2

jobs:
  materialize-and-build:
    name: Materialize / Java 25 / Minecraft 26.2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: hypershot/production-26.2
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and materialize readable project tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part.* | base64 --decode > /tmp/hypershot-source.tar.xz
          echo '7096eb452d17423125ce231ed78047bce3d501c8ed2a8a6d23d15c02c5a6e1d1  /tmp/hypershot-source.tar.xz' | sha256sum --check
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          tar -xJf /tmp/hypershot-source.tar.xz -C .
          chmod +x gradlew tools/*.sh
          git config user.name 'openai-hypershot-7c4e'
          git config user.email 'agent@openai.local'
          git add -A
          git commit -m 'feat: materialize HyperShot 26.2 source'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Toolchain information
        run: |
          java -version
          ./gradlew --version --no-daemon

      - name: Source policy guard
        run: ./tools/check-source-policy.sh

      - name: Dependency-free core tests
        run: ./tools/run-core-tests.sh

      - name: Production build
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Inspect production JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one production JAR, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          jar="${jars[0]}"
          sha256sum "$jar" | tee build/libs/hypershot.sha256
          unzip -p "$jar" fabric.mod.json | tee build/libs/fabric.mod.json
          unzip -l "$jar" > build/libs/jar-contents.txt

      - name: Upload first-pass verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypershot-bootstrap-verification
          path: |
            build/libs/**
            build/reports/**
            build/test-results/**
          if-no-files-found: warn
          retention-days: 14
