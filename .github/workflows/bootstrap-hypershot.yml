name: Materialize HyperShot source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-hypershot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated HyperShot branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'hypershot/production-26.2' }}
          fetch-depth: 0

      - name: Reassemble and verify exact source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/source.part.00 \
            .bootstrap/source.part.01 \
            .bootstrap/source.part.02 \
            .bootstrap/source.part.03 \
            .bootstrap/source.part.04 \
            .bootstrap/source.part.05 \
            .bootstrap/source.part.06 \
            | base64 --decode > /tmp/hypershot-source.tar.xz
          ls -lh /tmp/hypershot-source.tar.xz
          echo 'c6141f456578270be139b639e92fcfb3805b371fa5f64ea8b47c1a269cc14ca2  /tmp/hypershot-source.tar.xz' | sha256sum --check
          xz --test /tmp/hypershot-source.tar.xz
          tar -tJf /tmp/hypershot-source.tar.xz > /tmp/hypershot-source-files.txt
          test -s /tmp/hypershot-source-files.txt

      - name: Replace bootstrap branch with readable project source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          tar -xJf /tmp/hypershot-source.tar.xz -C .
          chmod +x gradlew tools/*.sh
          git config user.name 'openai-hypershot-7c4e'
          git config user.email 'agent@openai.local'
          git add -A
          git commit -m 'feat: materialize HyperShot 26.2 source'
          git push origin "HEAD:${GITHUB_HEAD_REF:-hypershot/production-26.2}"
