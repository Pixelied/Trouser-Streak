name: Materialize HyperShot source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-hypershot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated HyperShot branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'hypershot/production-26.2' }}
          fetch-depth: 0

      - name: Recover and verify exact source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import itertools
          from pathlib import Path

          expected = "7096eb452d17423125ce231ed78047bce3d501c8ed2a8a6d23d15c02c5a6e1d1"
          parts = sorted(Path(".bootstrap").glob("source.part.*"))
          if len(parts) != 7:
              raise SystemExit(f"Expected seven source chunks, found {len(parts)}")

          encoded = {path: "".join(path.read_text(encoding="utf-8").split()) for path in parts}
          print("Chunk lengths:", {path.name: len(encoded[path]) for path in parts})

          for order in itertools.permutations(parts):
              try:
                  archive = base64.b64decode("".join(encoded[path] for path in order), validate=True)
              except ValueError:
                  continue
              if hashlib.sha256(archive).hexdigest() == expected:
                  output = Path("/tmp/hypershot-source.tar.xz")
                  output.write_bytes(archive)
                  print("Verified chunk order:", " -> ".join(path.name for path in order))
                  break
          else:
              raise SystemExit("No permutation of the seven immutable chunks matched the expected archive checksum")
          PY
          echo '7096eb452d17423125ce231ed78047bce3d501c8ed2a8a6d23d15c02c5a6e1d1  /tmp/hypershot-source.tar.xz' | sha256sum --check
          xz --test /tmp/hypershot-source.tar.xz
          tar -tJf /tmp/hypershot-source.tar.xz >/tmp/hypershot-source-files.txt
          test -s /tmp/hypershot-source-files.txt

      - name: Replace bootstrap branch with readable project source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          tar -xJf /tmp/hypershot-source.tar.xz -C .
          chmod +x gradlew tools/*.sh
          git config user.name 'openai-hypershot-7c4e'
          git config user.email 'agent@openai.local'
          git add -A
          git commit -m 'feat: materialize HyperShot 26.2 source'
          git push origin "HEAD:${GITHUB_HEAD_REF:-hypershot/production-26.2}"
