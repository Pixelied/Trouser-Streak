name: Materialize HyperShot source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-hypershot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated HyperShot branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'hypershot/production-26.2' }}
          fetch-depth: 0

      - name: Verify and materialize complete project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part.* | base64 --decode > /tmp/hypershot-source.tar.xz
          echo '7096eb452d17423125ce231ed78047bce3d501c8ed2a8a6d23d15c02c5a6e1d1  /tmp/hypershot-source.tar.xz' | sha256sum --check
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          tar -xJf /tmp/hypershot-source.tar.xz -C .
          chmod +x gradlew tools/*.sh
          git config user.name 'openai-hypershot-7c4e'
          git config user.email 'agent@openai.local'
          git add -A
          git commit -m 'feat: materialize HyperShot 26.2 source'
          git push origin "HEAD:${GITHUB_HEAD_REF:-hypershot/production-26.2}"
