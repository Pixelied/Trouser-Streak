name: Materialize HyperShot source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-hypershot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated HyperShot branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'hypershot/production-26.2' }}
          fetch-depth: 0

      - name: Download and verify exact source ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/hypershot-source.zip \
            'https://drive.usercontent.google.com/download?id=1gyz9owr868X06x1sNjJegPEEFa2vrJ-v&export=download&confirm=t'
          ls -lh /tmp/hypershot-source.zip
          echo 'd25542910c037810a47cf4b48f4df34b6907c867a2ba6719f99d425087a916a3  /tmp/hypershot-source.zip' | sha256sum --check
          unzip -t /tmp/hypershot-source.zip

      - name: Replace bootstrap branch with readable project source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          unzip -q /tmp/hypershot-source.zip -d .
          chmod +x gradlew tools/*.sh
          git config user.name 'openai-hypershot-7c4e'
          git config user.email 'agent@openai.local'
          git add -A
          git commit -m 'feat: materialize HyperShot 26.2 source'
          git push origin "HEAD:${GITHUB_HEAD_REF:-hypershot/production-26.2}"
