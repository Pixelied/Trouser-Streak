name: Fix HyperShot core test transfer

on:
  push:
    branches:
      - hypershot/production-26.2
    paths:
      - '.github/workflows/fix-hypershot-core-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hypershot/production-26.2
          fetch-depth: 0
      - name: Correct transferred test source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/test/java/dev/hypershot/core/CoreTestMain.java')
          text = path.read_text()
          duplicate = '''        near(-whole.right(), whole.left(), 1e-12, "full projection symmetric x");
        near(1000.0, w.far(), 1e-9, "far preserved");
        ProjectionWindow whole = TileProjectionCalculator.fullFrame(16, 9, 70, 0.05, 1000);
        near(-whole.right(), whole.left(), 1e-12, "full projection symmetric x");
'''
          replacement = '''        near(-whole.right(), whole.left(), 1e-12, "full projection symmetric x");
'''
          if text.count(duplicate) != 1:
              raise SystemExit('Unexpected projection duplicate count')
          if text.count('row[i] = (byte) r;') != 1:
              raise SystemExit('Unexpected JPEG variable count')
          text = text.replace(duplicate, replacement)
          text = text.replace('row[i] = (byte) r;', 'row[i] = (byte) x;')
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/test/java/dev/hypershot/core/CoreTestMain.java
          git commit -m 'test(hypershot): correct layout regression transfer'
          git push origin HEAD:hypershot/production-26.2
