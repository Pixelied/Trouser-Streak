name: Apply HyperShot capture UI fix

on:
  push:
    branches:
      - fix/hypershot-capture-ui-0.2.1
    paths:
      - '.ship/hypershot-fix.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hypershot-capture-ui-0.2.1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ship/hypershot-fix.patch.gz.b64 | gzip -d > /tmp/hypershot-fix.patch
          echo 'afc81db71cf08aad8401ecd8449a445a965efc95e679ea8b80fcde626a5865f8  /tmp/hypershot-fix.patch' | sha256sum -c -
          git apply --check /tmp/hypershot-fix.patch
          git apply /tmp/hypershot-fix.patch
          chmod +x tools/*.sh gradlew
          ./tools/run-core-tests.sh
          ./tools/verify-project.sh
      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tools
          git commit -m 'fix: repair capture target and simplify extreme screenshot UI'
          git push origin HEAD:fix/hypershot-capture-ui-0.2.1
