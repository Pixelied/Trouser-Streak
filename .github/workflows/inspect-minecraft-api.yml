name: Inspect Minecraft 26.2 API

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-minecraft-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate and inspect official mapped sources
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew genSources --stacktrace --no-daemon
          mkdir -p build/api-inspection/extracted
          find "$PWD" "$HOME/.gradle/caches" -type f \( -name '*sources*.jar' -o -name '*source*.jar' \) 2>/dev/null | sort -u > build/api-inspection/source-jars.txt
          CLIENT_JAR=''
          COMMON_JAR=''
          while IFS= read -r jar; do
            if [ -z "$CLIENT_JAR" ] && jar tf "$jar" 2>/dev/null | grep -q '^net/minecraft/client/Minecraft.java$'; then
              CLIENT_JAR="$jar"
            fi
            if [ -z "$COMMON_JAR" ] && jar tf "$jar" 2>/dev/null | grep -q '^net/minecraft/util/Util.java$'; then
              COMMON_JAR="$jar"
            fi
          done < build/api-inspection/source-jars.txt
          if [ -z "$CLIENT_JAR" ] || [ -z "$COMMON_JAR" ]; then
            echo "CLIENT_JAR=$CLIENT_JAR COMMON_JAR=$COMMON_JAR" >&2
            cat build/api-inspection/source-jars.txt >&2
            exit 1
          fi
          printf 'CLIENT_JAR=%s\nCOMMON_JAR=%s\n' "$CLIENT_JAR" "$COMMON_JAR" | tee build/api-inspection/source-jars-selected.txt
          for class in \
            net/minecraft/client/Minecraft.java \
            net/minecraft/client/renderer/GameRenderer.java \
            net/minecraft/client/renderer/state/WindowRenderState.java \
            net/minecraft/client/renderer/state/GameRenderState.java \
            net/minecraft/client/renderer/state/level/CameraRenderState.java \
            net/minecraft/client/player/LocalPlayer.java; do
            unzip -p "$CLIENT_JAR" "$class" > "build/api-inspection/extracted/$(basename "$class")"
          done
          unzip -p "$COMMON_JAR" net/minecraft/util/Util.java > build/api-inspection/extracted/Util.java
          {
            echo '=== Minecraft render target / GUI / messaging ==='
            grep -nE 'mainRenderTarget|RenderTarget|showDebugChat|gui|screen|message|chat' build/api-inspection/extracted/Minecraft.java | head -n 180 || true
            echo '=== GameRenderer state / camera / render / resize ==='
            grep -nE 'GameRenderState|gameRenderState|mainCamera|mainRenderTarget|Camera|render\(|extract\(|resize\(|Fov|fov' build/api-inspection/extracted/GameRenderer.java | head -n 240 || true
            echo '=== WindowRenderState ==='
            cat build/api-inspection/extracted/WindowRenderState.java
            echo '=== CameraRenderState ==='
            cat build/api-inspection/extracted/CameraRenderState.java
            echo '=== LocalPlayer messaging ==='
            grep -nE 'sendSystemMessage|sendOverlayMessage|message|Message|chat|Chat|display' build/api-inspection/extracted/LocalPlayer.java | head -n 180 || true
            echo '=== Util platform opening ==='
            grep -nE 'class Util|getPlatform|enum Platform|open|File|Path|URI|URL' build/api-inspection/extracted/Util.java | head -n 300 || true
          } | tee build/api-inspection/signatures.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-26.2-api-inspection
          path: build/api-inspection/**
          if-no-files-found: error
          retention-days: 7
