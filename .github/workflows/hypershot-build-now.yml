name: HyperShot production build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 25 / Minecraft 26.2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: hypershot/production-26.2

      - name: Prepare project tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hypershot
          mkdir -p /tmp/hypershot
          if [ -d .bootstrap ]; then
            cat .bootstrap/source.part.* | base64 --decode > /tmp/hypershot-source.tar.xz
            echo '7096eb452d17423125ce231ed78047bce3d501c8ed2a8a6d23d15c02c5a6e1d1  /tmp/hypershot-source.tar.xz' | sha256sum --check
            tar -xJf /tmp/hypershot-source.tar.xz -C /tmp/hypershot
          else
            cp -a . /tmp/hypershot
            rm -rf /tmp/hypershot/.git
          fi
          chmod +x /tmp/hypershot/gradlew /tmp/hypershot/tools/*.sh

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Source policy and dependency-free tests
        working-directory: /tmp/hypershot
        run: |
          ./tools/check-source-policy.sh
          ./tools/run-core-tests.sh

      - name: Build production mod
        id: build
        working-directory: /tmp/hypershot
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/verification
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee build/verification/gradle-build.log

      - name: Inspect production JAR
        if: success()
        working-directory: /tmp/hypershot
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one production JAR, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          jar="${jars[0]}"
          sha256sum "$jar" | tee build/libs/hypershot.sha256
          unzip -p "$jar" fabric.mod.json | tee build/libs/fabric.mod.json
          unzip -l "$jar" > build/libs/jar-contents.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypershot-production-build
          path: |
            /tmp/hypershot/build/libs/**
            /tmp/hypershot/build/reports/**
            /tmp/hypershot/build/test-results/**
            /tmp/hypershot/build/verification/**
          if-no-files-found: warn
          retention-days: 30
