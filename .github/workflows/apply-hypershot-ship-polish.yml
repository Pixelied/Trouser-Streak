name: Apply HyperShot ship polish

on:
  push:
    branches:
      - hypershot/production-26.2
    paths:
      - '.ship/hypershot-ship-source.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hypershot-ship-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: hypershot/production-26.2
          fetch-depth: 0

      - name: Verify and apply ship-polish source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .ship/hypershot-ship-source.b64 > /tmp/hypershot-ship-source.tar.gz
          actual="$(sha256sum /tmp/hypershot-ship-source.tar.gz | awk '{print $1}')"
          expected="8468c10b945e4be05ce29510016798fb07d658aac5891f6191ab21d2eca790bf"
          test "$actual" = "$expected"
          if tar -tzf /tmp/hypershot-ship-source.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe path in patch archive' >&2
            exit 1
          fi
          tar -xzf /tmp/hypershot-ship-source.tar.gz -C .
          rm -rf .ship
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(hypershot): ship polished Minecraft UI and Mod Menu support'
          git push origin HEAD:hypershot/production-26.2
