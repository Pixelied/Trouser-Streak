name: Apply final HyperShot reliability fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-final-reliability-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'hypershot/production-26.2' }}
          fetch-depth: 0
      - name: Apply assertion-checked reliability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          capture = 'src/client/java/dev/hypershot/capture/CaptureManager.java'
          replace(
              capture,
              '        done.encoder.encode(done.currentSurface, done.tempPath);\n        done.progress.phase(CapturePhase.GENERATING_THUMBNAIL);',
              '        done.encoder.encode(done.currentSurface, done.tempPath);\n        done.token.throwIfCancelled();\n        done.progress.phase(CapturePhase.GENERATING_THUMBNAIL);'
          )
          replace(
              capture,
              '        done.progress.phase(CapturePhase.FINALIZING);\n        atomicMove(done.tempPath, done.outputPath);',
              '        done.progress.phase(CapturePhase.FINALIZING);\n        done.token.throwIfCancelled();\n        atomicMove(done.tempPath, done.outputPath);'
          )
          replace(
              capture,
              '''    private void completeSuccess(ActiveCapture done, Path finalFile, Path metadata, Path thumbnail, long fileSize) {\n        listener.onCompleted(done.id, finalFile, metadata, thumbnail, fileSize);\n        active = null;\n    }\n\n    private void completeFailure(ActiveCapture failed, Throwable error) {\n        try { if (failed.currentSurface != null) failed.currentSurface.close(); } catch (IOException ignored) {}\n        try { Files.deleteIfExists(failed.tempPath); } catch (IOException ignored) {}\n        failed.encoderService.shutdownNow();\n        failed.stateSnapshot.restore();\n        listener.onFailed(failed.id, error.getMessage(), error);\n        active = null;\n    }\n''',
              '''    private void completeSuccess(ActiveCapture done, Path finalFile, Path metadata, Path thumbnail, long fileSize) {\n        dispatchClient(() -> {\n            if (active != done) return;\n            listener.onCompleted(done.id, finalFile, metadata, thumbnail, fileSize);\n            active = null;\n        });\n    }\n\n    private void completeFailure(ActiveCapture failed, Throwable error) {\n        try { if (failed.currentSurface != null) failed.currentSurface.close(); } catch (IOException ignored) {}\n        try { Files.deleteIfExists(failed.tempPath); } catch (IOException ignored) {}\n        failed.encoderService.shutdownNow();\n        dispatchClient(() -> {\n            failed.stateSnapshot.restore();\n            if (active != failed) return;\n            listener.onFailed(failed.id, error.getMessage(), error);\n            active = null;\n        });\n    }\n\n    private void dispatchClient(Runnable action) {\n        if (minecraft.isSameThread()) action.run();\n        else minecraft.execute(action);\n    }\n'''
          )

          notification = 'src/client/java/dev/hypershot/notification/CaptureNotificationManager.java'
          replace(
              notification,
              '        gallery.add(record);\n        textures.get(thumbnail);',
              '        gallery.add(record);\n        HyperShotClient.scheduleGallerySave();\n        textures.get(thumbnail);'
          )

          gallery = 'src/client/java/dev/hypershot/ui/GalleryScreen.java'
          replace(
              gallery,
              '        HyperShotClient.galleryIndex().setFavorite(selected.id, selected.favorite);\n        rebuildWidgets();',
              '        HyperShotClient.galleryIndex().setFavorite(selected.id, selected.favorite);\n        HyperShotClient.scheduleGallerySave();\n        rebuildWidgets();'
          )
          replace(
              gallery,
              '            HyperShotClient.galleryIndex().remove(selected.id);\n            selected = null;',
              '            HyperShotClient.galleryIndex().remove(selected.id);\n            HyperShotClient.scheduleGallerySave();\n            selected = null;'
          )
          replace(
              gallery,
              '            HyperShotClient.galleryIndex().add(undo.record());\n            selected = undo.record();',
              '            HyperShotClient.galleryIndex().add(undo.record());\n            HyperShotClient.scheduleGallerySave();\n            selected = undo.record();'
          )

          viewer = 'src/client/java/dev/hypershot/ui/ImageViewerScreen.java'
          replace(
              viewer,
              '            HyperShotClient.galleryIndex().setFavorite(record.id, record.favorite);\n            rebuildWidgets();',
              '            HyperShotClient.galleryIndex().setFavorite(record.id, record.favorite);\n            HyperShotClient.scheduleGallerySave();\n            rebuildWidgets();'
          )
          PY
          git diff --check
          git diff --stat
          git config user.name 'openai-hypershot-7c4e'
          git config user.email 'agent@openai.local'
          git add src/client/java
          git commit -m 'fix: serialize completion callbacks and persist gallery changes'
          git push origin "HEAD:${GITHUB_HEAD_REF:-hypershot/production-26.2}"
