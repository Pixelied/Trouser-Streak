name: Fix final camera API occurrence

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-final-camera-api.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'hypershot/production-26.2' }}
          fetch-depth: 0
      - name: Replace the final stale accessor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/client/java/dev/hypershot/capture/CaptureManager.java')
          text = path.read_text(encoding='utf-8')
          old = 'minecraft.gameRenderer.getMainCamera().getFov()'
          new = 'minecraft.gameRenderer.mainCamera().getFov()'
          found = text.count(old)
          if found != 1:
              raise SystemExit(f'Expected exactly one stale camera accessor, found {found}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          grep -R --line-number 'getMainCamera()' src && exit 1 || true
          git config user.name 'openai-hypershot-7c4e'
          git config user.email 'agent@openai.local'
          git add src/client/java/dev/hypershot/capture/CaptureManager.java
          git commit -m 'fix: use official camera accessor in metadata'
          git push origin "HEAD:${GITHUB_HEAD_REF:-hypershot/production-26.2}"
