name: Materialize HyperShot source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-hypershot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hypershot-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated HyperShot branch
        uses: actions/checkout@v4
        with:
          ref: hypershot/production-26.2
          fetch-depth: 0

      - name: Download and verify exact source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/hypershot-source.zip \
            'https://drive.usercontent.google.com/download?id=1mNGbhmDDenRrNtETwfU0JRxHZ6a5gpdi&export=download&confirm=t'
          echo 'd25542910c037810a47cf4b48f4df34b6907c867a2ba6719f99d425087a916a3  /tmp/hypershot-source.zip' | sha256sum --check
          unzip -t /tmp/hypershot-source.zip

      - name: Replace bootstrap branch with readable project source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          unzip -q /tmp/hypershot-source.zip -d .
          chmod +x gradlew tools/*.sh
          git config user.name 'openai-hypershot-7c4e'
          git config user.email 'agent@openai.local'
          git add -A
          git commit -m 'feat: materialize HyperShot 26.2 source'
          git push origin HEAD:hypershot/production-26.2
