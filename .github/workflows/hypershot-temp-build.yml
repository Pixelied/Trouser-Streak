name: HyperShot Temporary Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'hypershot-build/**'
      - '.github/workflows/hypershot-temp-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify and materialize HyperShot source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(hypershot-build/incoming/source.part*)
          if (( ${#parts[@]} > 0 )); then
            test "${#parts[@]}" -eq 7
            cat "${parts[@]}" | base64 --decode > /tmp/hypershot-source.tar.gz
            actual_sha="$(sha256sum /tmp/hypershot-source.tar.gz | awk '{print $1}')"
            expected_sha="10ebcf4b7caac57b07bec6eb91b4de406658257444812d598306de1904fc6fe5"
            test "$actual_sha" = "$expected_sha"

            if tar -tzf /tmp/hypershot-source.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo 'Unsafe archive path detected' >&2
              exit 1
            fi

            rm -rf hypershot-build/project
            mkdir -p hypershot-build/project
            tar -xzf /tmp/hypershot-source.tar.gz -C hypershot-build/project
            rm -rf hypershot-build/incoming

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A hypershot-build
            git commit -m 'ci(hypershot): materialize project source [skip ci]'
            git push origin "HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: hypershot-build/project/**/*.gradle*

      - name: Verify project structure and core tests
        working-directory: hypershot-build/project
        shell: bash
        run: |
          chmod +x gradlew tools/*.sh
          ./tools/verify-project.sh

      - name: Build production JAR
        working-directory: hypershot-build/project
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Inspect production JAR
        working-directory: hypershot-build/project
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'hypershot-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$jar_path"
          jar tf "$jar_path" > build/jar-contents.txt
          grep -qx 'fabric.mod.json' build/jar-contents.txt
          grep -qx 'dev/hypershot/HyperShotClient.class' build/jar-contents.txt
          sha256sum "$jar_path" | tee build/hypershot-sha256.txt

      - name: Package materialized source
        working-directory: hypershot-build
        run: zip -qr HyperShot-26.2-source.zip project

      - name: Upload HyperShot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HyperShot-26.2
          if-no-files-found: error
          retention-days: 30
          path: |
            hypershot-build/project/build/libs/*.jar
            hypershot-build/project/build/reports/**
            hypershot-build/project/build/jar-contents.txt
            hypershot-build/project/build/hypershot-sha256.txt
            hypershot-build/project/verification/**
            hypershot-build/HyperShot-26.2-source.zip
